# Scenario: plain web app + Service -> chart must infer a Deployment.
replicas: 1
containers:
  - name: web
    image: nginx
    imageTag: "1.27-alpine"
    ports:
      - containerPort: 80
    readinessProbe:
      httpGet:
        path: /
        port: 80
      initialDelaySeconds: 2
      periodSeconds: 3
    resources:
      limits:
        cpu: 100m
        memory: 64Mi
service:
  type: ClusterIP
  ports:
    - port: 80
